  - { id: user,    x: 8, y: 0, w: 7, h: 7 }
  - { id: kitchen, x: 0, y: 7, w: 6, h: 7 }
  - { id: lobby,   x: 6, y: 7, w: 9, h: 7 }
  - { id: work,    x: 0, y: 14, w: 15, h: 11, desks: 6 }
doors:
